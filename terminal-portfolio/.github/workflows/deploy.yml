name: CI/CD Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: docker.io
  FRONTEND_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/frontend
  BACKEND_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Frontend Image
      run: docker build -t $FRONTEND_IMAGE:latest ./frontend

    - name: Build Backend Image
      run: docker build -t $BACKEND_IMAGE:latest ./backend

    - name: Push Frontend Image
      run: docker push $FRONTEND_IMAGE:latest

    - name: Push Backend Image
      run: docker push $BACKEND_IMAGE:latest

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.29.0'

    - name: Configure kubeconfig
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/frontend frontend=$FRONTEND_IMAGE:latest
        kubectl set image deployment/backend backend=$BACKEND_IMAGE:latest
        kubectl rollout restart deployment/frontend
        kubectl rollout restart deployment/backend

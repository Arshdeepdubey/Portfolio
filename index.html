    <!-- Single Page Apps for GitHub Pages redirect receiver -->
    <script type="text/javascript">
      (function() {
        var q = window.location.search;
        if (q.indexOf('?p=') === 0 || q.indexOf('&p=') !== -1) {
          var l = window.location;
          var p = q.slice(3).split('&')[0].replace(/~and~/g, '&');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + p +
            (l.search.indexOf('&q=') !== -1 ? '?' + l.search.split('&q=')[1].split('&')[0].replace(/~and~/g, '&') : '') +
            l.hash
          );
        }
      })();
    </script>

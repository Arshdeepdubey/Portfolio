<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Dynamically detects whether we're in the root (/Portfolio/) or resume (/Portfolio/resume/) deployment
      // and redirects to the appropriate index.html with the path encoded as a query parameter
      
      var l = window.location;
      var pathname = l.pathname;
      
      // Detect if we're in the /resume/ subdirectory
      var isResumeDeployment = pathname.includes('/resume/');
      var basePath = isResumeDeployment ? '/Portfolio/resume/' : '/Portfolio/';
      
      // Extract remaining path segments after the base path
      var segments = pathname.split('/').filter(Boolean); // Remove empty strings
      var pathStartIndex = isResumeDeployment ? 3 : 2; // Skip 'Portfolio' or 'Portfolio/resume'
      var remainingPath = segments.slice(pathStartIndex).join('/');
      
      // Redirect to index.html with encoded path
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + 
        basePath + '?p=/' + (remainingPath ? remainingPath + '/' : '').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>

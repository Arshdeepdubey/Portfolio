name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: 
      - arsh-portfolio-setup
  pull_request:
    branches:
      - arsh-portfolio-setup

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mac-portfolio/package-lock.json

      - name: Install Project Dependencies
        working-directory: mac-portfolio
        run: npm ci

      - name: Lint Code Quality Check
        working-directory: mac-portfolio
        run: npm run lint

      - name: Compile Code and Build Production Static Site
        working-directory: mac-portfolio
        run: npm run build

     # 1. Create the file to bypass Jekyll
      - name: Bypass Jekyll on GitHub Pages
        run: touch mac-portfolio/dist/.nojekyll

      # 2. Push the files (without the dotfiles parameter)
      - name: Push Build Output to GitHub Pages Branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arsh-portfolio-setup'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: mac-portfolio/dist
          branch: gh-pages
          clean: true # Ensure the .nojekyll file gets pushed
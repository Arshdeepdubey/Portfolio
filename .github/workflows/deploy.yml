name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ arsh-portfolio-setup, main ] # Triggers the pipeline on every push to main

permissions:
  contents: write # Allows the action to commit build artifacts to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mac-portfolio/package-lock.json

      - name: Install Project Dependencies
        working-directory: mac-portfolio
        run: npm ci

      - name: Lint Code Quality Check
        working-directory: mac-portfolio
        run: npm run lint

      - name: Compile Code and Build Production Static Site
        working-directory: mac-portfolio
        run: npm run build

      - name: Push Build Output to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: mac-portfolio/dist
          branch: gh-pages

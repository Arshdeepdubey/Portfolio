name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: 
      - arsh-portfolio-setup 
      - phase/1-resume-update

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Determine Deployment Target Directory
        id: target
        run: |
          if [ "${{ github.ref_name }}" = "arsh-portfolio-setup" ]; then
            echo "folder=." >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "phase/1-resume-update" ]; then
            echo "folder=resume" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mac-portfolio/package-lock.json

      - name: Install Project Dependencies
        working-directory: mac-portfolio
        run: npm ci

      - name: Lint Code Quality Check
        working-directory: mac-portfolio
        run: npm run lint

      - name: Compile Code and Build Production Static Site
        working-directory: mac-portfolio
        run: npm run build

      - name: Push Build Output to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: mac-portfolio/dist
          branch: gh-pages
          target-folder: ${{ steps.target.outputs.folder }}
          clean: false # Keeps both root and subfolder deployments active
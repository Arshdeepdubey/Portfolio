<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This script takes the current URL and redirects it to the index.html page 
      // with the path encoded as a query parameter, which Vite/React Router can then parse.
      var pathSegmentsToKeep = 1; // Adjust based on your repo name depth (1 for /Portfolio/)

      var l = window.location;
      var repoName = l.pathname.split('/')[1]; // Extracts 'Portfolio'
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/' + repoName + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
